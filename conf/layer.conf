# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-jr"
BBFILE_PATTERN_meta-jr = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-jr = "10"

LAYERDEPENDS_meta-jr = "core"
LAYERSERIES_COMPAT_meta-jr = "kirkstone"
